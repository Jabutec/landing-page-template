  SMALL BUSINESS LANDING PAGE TEMPLATE
  --------------------------------------------------------------------
  HOW TO CUSTOMIZE FOR A NEW CLIENT:
  1. Scroll to the SITE_CONFIG object in the <script> tag in <head>.
  2. Change the text, contact info, services, testimonials, FAQ, theme
     colors and fonts there. Nothing else in this file needs editing.
  3. Set a section to false in SITE_CONFIG.sections to hide it.
  4. To hook up the contact form, set contact.formEndpoint to a
     Formspree / Netlify Forms endpoint. Until then it simulates a
     successful submission.

  NOTE: Tailwind is loaded via CDN for simplicity. For production
  sites, compile Tailwind (npx tailwindcss -o dist.css --minify) to
  strip unused classes and remove the CDN script.
================================================================== -->

                <span id="submit-label">Send Message</span>
                <svg id="submit-spin" class="hidden animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              </button>
              <p class="text-slate-400 text-xs mt-3 text-center">We’ll never share your details. No spam, ever.</p>

          </div>
          <div id="form-success" class="hidden text-center py-10">

            <h3 class="font-display text-2xl font-bold text-slate-900 mt-5">Message sent!</h3>

const tplFooter = () => `
<footer class="bg-slate-900 text-slate-400">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 grid md:grid-cols-3 gap-10">
    <div>
      <div class="flex items-center gap-2">

    <div>

      <ul class="mt-4 space-y-2.5 text-sm">

    </div>
  </div>
  <div class="border-t border-white/10">

      <span>© <span id="year"></span> ${cfg.businessName}. All rights reserved.</span>
      <span>Built with the small-business landing template.</span>
    </div>
  </div>

/* ---------- init ---------- */
(function init() {
  const t = cfg.theme;
  const root = document.documentElement;
  root.style.setProperty("--color-primary", t.primary);
  root.style.setProperty("--color-primary-dark", t.primaryDark);
  root.style.setProperty("--color-primary-soft", t.primarySoft);
  root.style.setProperty("--color-accent", t.accent);
  root.style.setProperty("--font-heading", `'${t.headingFont}', sans-serif`);
  root.style.setProperty("--font-body", `'${t.bodyFont}', sans-serif`);

  // Fonts + meta
  const fams = [...new Set([t.headingFont, t.bodyFont])]
    .map(f => `family=${f.replace(/ /g, "+")}:wght@400;500;600;700;800`).join("&");
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?${fams}&display=swap`;
  document.head.appendChild(link);
  document.title = `${cfg.businessName} — ${cfg.tagline.split(".")[0]}`;
  document.querySelector('meta[name="description"]').setAttribute("content", cfg.tagline);

  // Render
  document.getElementById("app").innerHTML =
    tplNavbar() + tplHero() +
    (sectionOn("stats") ? tplStats() : "") +
    tplServices() +
    (sectionOn("about") ? tplAbout() : "") +
    (sectionOn("testimonials") ? tplTestimonials() : "") +
    (sectionOn("faq") ? tplFaq() : "") +
    tplCta() + tplContact() + tplFooter();

  document.getElementById("year").textContent = new Date().getFullYear();

  /* Navbar scroll state */
  const nav = document.getElementById("navbar");
  const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 40);
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  /* Mobile menu */
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  const setMenu = (open) => {
    mobileMenu.classList.toggle("open", open);
    document.getElementById("ic-open").classList.toggle("hidden", open);
    document.getElementById("ic-close").classList.toggle("hidden", !open);
  };
  menuBtn.addEventListener("click", () => setMenu(!mobileMenu.classList.contains("open")));
  mobileMenu.querySelectorAll(".m-link").forEach(a => a.addEventListener("click", () => setMenu(false)));

  /* Scroll reveal */
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("revealed"); revealObs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => revealObs.observe(el));

  /* Stat count-up */
  const countObs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target, target = parseFloat(el.dataset.target), suffix = el.dataset.suffix;
      const decimals = (el.dataset.target.split(".")[1] || "").length;
      const start = performance.now(), dur = 1600;
      const tick = (now) => {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = (target * eased).toFixed(decimals) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      countObs.unobserve(el);
    });
  }, { threshold: 0.5 });
  document.querySelectorAll(".stat-num").forEach(el => countObs.observe(el));

  /* Testimonials slider */
  const slides = [...document.querySelectorAll(".t-slide")];
  const dots = [...document.querySelectorAll(".t-dot")];
  let tIdx = 0, timer;
  const show = (i) => {
    tIdx = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("active", k === tIdx));
    dots.forEach((d, k) => {
      d.className = "t-dot rounded-full transition h-2.5 " + (k === tIdx ? "bg-accent w-6" : "bg-white/25 w-2.5");
    });
  };
  const restart = () => { clearInterval(timer); timer = setInterval(() => show(tIdx + 1), 6000); };
  document.getElementById("t-prev").addEventListener("click", () => { show(tIdx - 1); restart(); });
  document.getElementById("t-next").addEventListener("click", () => { show(tIdx + 1); restart(); });
  dots.forEach(d => d.addEventListener("click", () => { show(+d.dataset.dot); restart(); }));
  const slider = document.getElementById("t-slider");
  slider.addEventListener("mouseenter", () => clearInterval(timer));
  slider.addEventListener("mouseleave", restart);
  restart();

  /* FAQ accordion */
  document.querySelectorAll(".faq-item").forEach(item => {
    const btn = item.querySelector(".faq-q"), body = item.querySelector(".faq-a"), icn = item.querySelector(".faq-ic");
    btn.addEventListener("click", () => {
      const open = body.style.maxHeight && body.style.maxHeight !== "0px";
      document.querySelectorAll(".faq-a").forEach(b => b.style.maxHeight = "0px");
      document.querySelectorAll(".faq-ic").forEach(i => i.style.transform = "");
      if (!open) { body.style.maxHeight = body.scrollHeight + "px"; icn.style.transform = "rotate(180deg)"; }
    });
  });

  /* Contact form */
  const form = document.getElementById("contact-form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    let valid = true;
    const check = (id, test) => {
      const input = document.getElementById(id);
      const err = input.parentElement.querySelector(".err");
      const ok = test(input.value.trim());
      if (err) err.classList.toggle("hidden", ok);
      input.classList.toggle("border-red-400", !ok);
      if (!ok) valid = false;
    };
    check("f-name", v => v.length > 1);
    check("f-email", v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v));
    check("f-msg", v => v.length > 5);
    if (!valid) return;

    document.getElementById("submit-label").textContent = "Sending…";
    document.getElementById("submit-spin").classList.remove("hidden");
    form.querySelector("button[type=submit]").disabled = true;

    try {
      if (cfg.contact.formEndpoint) {
        await fetch(cfg.contact.formEndpoint, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form),
        });
      } else {
        await new Promise(r => setTimeout(r, 1200)); // simulated send
      }
      document.getElementById("form-fields").classList.add("hidden");
      document.getElementById("form-success").classList.remove("hidden");
    } catch {
      document.getElementById("submit-label").textContent = "Send Message";
      document.getElementById("submit-spin").classList.add("hidden");
      form.querySelector("button[type=submit]").disabled = false;
      alert("Something went wrong. Please try calling or emailing us directly.");
    }
  });

  /* Scrollspy for nav links */
  const spyMap = {};
  visibleLinks.forEach(l => {
    const sec = document.getElementById(l.href.replace("#", ""));
    if (sec) spyMap[l.href.replace("#", "")] = sec;
  });
  const spyObs = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const link = document.querySelector(`.nav-link[data-spy="${en.target.id}"]`);
      if (!link) return;
      if (en.isIntersecting) {
        document.querySelectorAll(".nav-link").forEach(n => n.classList.remove("nav-active"));
        link.classList.add("nav-active");
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  Object.values(spyMap).forEach(s => spyObs.observe(s));
})();
</script>
</body>
</html>
